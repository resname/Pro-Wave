[workspace]
resolver = "2"
members = [
    "crates/prowave-engine",
    "crates/prowave-project",
    "crates/prowave-garageband-import",
    "crates/prowave-rex",
    "crates/prowave-plugin-host",
    "crates/prowave-plugin-helper",
    "crates/prowave-app",
    "xtask",
]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
